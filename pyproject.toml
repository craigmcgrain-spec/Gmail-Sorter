[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-sort"
version = "0.1.0"
description = "Label a large Gmail backlog with rules plus an LLM fallback"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
gmail-sort = "gmail_sort.cli:main"

[tool.setuptools]
packages = ["gmail_sort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
